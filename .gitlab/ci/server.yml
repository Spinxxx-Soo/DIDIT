test_server:
  stage: test
  tags: ["test"]
  image: eclipse-temurin:21-jdk
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes:
        - apps/server/**/*
        - .gitlab/ci/server.yml
        - .gitlab-ci.yml
  cache:
    key: gradle-server
    paths:
      - apps/server/.gradle/
  script:
    - cd apps/server
    - chmod +x gradlew
    - ./gradlew --no-daemon test
  artifacts:
    when: always
    reports:
      junit: apps/server/build/test-results/test/*.xml

build_push_server:
  stage: build
  tags: ["docker"]
  image: docker:24
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      changes:
        - apps/server/**/*
        - .gitlab/ci/server/server.yaml
        - .gitlab-ci.yml
  before_script:
    - echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
  script:
    - docker build -t ghcr.io/pjtdidit/server-image:$CI_COMMIT_SHA -t ghcr.io/pjtdidit/server-image:latest -f apps/server/Dockerfile apps/server
    - docker push ghcr.io/pjtdidit/server-image:$CI_COMMIT_SHA
    - docker push ghcr.io/pjtdidit/server-image:latest

