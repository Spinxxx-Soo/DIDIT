# .gitlab/ci/deploy.yml

deploy_portainer:
  stage: deploy
  tags: ["deploy"]
  image: curlimages/curl:8.5.0
  needs: 
    - job: build_push_server
      optional: true
    - job: build_push_client
      optional: true
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      changes:
        - apps/server/**/*
        - apps/client/**/*
        - .gitlab/ci/**/*
        - .gitlab-ci.yml
    - when: never
  variables:
    GIT_STRATEGY: none
  script:
    - |
      set -eu
      if [ -z "${PORTAINER_WEBHOOK_URL:-}" ]; then
        echo "ERROR: PORTAINER_WEBHOOK_URL is not set"
        exit 1
      fi
      curl -fsS -X POST "$PORTAINER_WEBHOOK_URL"
      echo "Portainer redeploy triggered."
