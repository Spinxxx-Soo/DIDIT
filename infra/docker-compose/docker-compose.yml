version: "3.8"

services:
  db:
    image: mysql:8.0
    container_name: didit-mysql
    restart: unless-stopped
    # ports:
    #   - "3306:3306"
    environment:
      TZ: Asia/Seoul
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: didit
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      - --default-time-zone=+09:00
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-u", "root", "-ppassword"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - internal

  server:
    image: ghcr.io/pjtdidit/server-image:latest
    container_name: didit-server
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    # ports:
    #   - "8080:8080"
    expose:
      - "8080"
    environment:
      TZ: Asia/Seoul
      MYSQL_DATABASE: didit
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_HOST: db
      MYSQL_PORT: 3306
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-defaultId}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-defaultSecret}
      OPENVIDU_URL: ${OPENVIDU_URL:-default}
      OPENVIDU_SECRET: ${OPENVIDU_SECRET:-default}
      REDIS_HOST: ${REDIS_HOST:-default}
      REDIS_PORT: ${REDIS_PORT:-default}
      REDIS_PASSWORD: ${REDIS_PASSWORD:-default}
    networks:
      - internal
      - caddy_default
        
  client:
    image: ghcr.io/pjtdidit/client-image:latest
    container_name: didit-client
    restart: unless-stopped
    networks:
      - internal
      - caddy_default

  openvidu:
    container_name: didit-openvidu
    image: openvidu/openvidu-dev:2.32.1
    networks:
      internal:
        aliases:
          - openvidu
    environment:
      OPENVIDU_SECRET: ${OPENVIDU_SECRET}

  redis:
    image: redis:7.2-alpine
    container_name: redis
    restart: unless-stopped
    ports:
      - ${REDIS_PORT:-6379}:6379
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD}
    command: >
      sh -c "redis-server
      --appendonly yes
      --requirepass $$REDIS_PASSWORD"
    volumes:
      - redis_data:/data
    networks:
      - internal

volumes:
  mysql-data:
  redis_data:

networks:
  internal:
    driver: bridge
  caddy_default:
    external: true
